<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OhoMAN | Secure Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            /* OhoMAN Brand Colors */
            --oho-navy: #2c4964;
            --oho-accent: #3fbbc0; /* Keeping your teal as the action color */
            --oho-bg: #f4f7f6;
        }

        body {
            background-color: var(--oho-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .payment-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            overflow: hidden;
            border: none;
            max-width: 480px;
            width: 100%;
            margin: auto;
        }

        .card-header-custom {
            background-color: var(--oho-navy);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .oho-logo {
            font-weight: 800;
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .oho-logo span {
            color: var(--oho-accent);
        }

        .card-body {
            padding: 40px;
        }

        .order-details {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .price-tag {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--oho-navy);
            text-align: center;
            margin: 10px 0 30px 0;
        }

        /* Razorpay Themed Button */
        .btn-razorpay {
            background: #3395FF;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(51, 149, 255, 0.2);
        }

        .btn-razorpay:hover {
            background: #2578d1;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(51, 149, 255, 0.3);
            color: white;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="payment-card">

        <div class="card-header-custom">
            <div class="oho-logo">Oho<span>MAN</span></div>
            <p class="mb-0 opacity-75 small fw-bold">SECURE SERVICE CHECKOUT</p>
        </div>

        <div class="card-body">


            <div class="price-tag">
                <small style="font-size: 1.2rem; vertical-align: middle; margin-right: 5px;">₹</small>{{a}}
            </div>

            <form id="payment-form" action="/success/" method="POST">
                {% csrf_token %}
                <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
                <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
                <input type="hidden" name="razorpay_signature" id="razorpay_signature">

                <button type="button" id="rzp-button1" class="btn btn-razorpay">
                    <i class="bi bi-shield-lock-fill"></i> PAY SECURELY
                </button>
            </form>

            <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

            <script>
                var options = {
                    "key": "rzp_test_SROSnyInFv81S4",
                    "amount": "{{r}}",
                    "currency": "INR",
                    "name": "OhoMAN",
                    "description": "Professional Service Booking",
                    "order_id": "{{ payment.id }}",
                    "handler": function (response){
                        document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
                        document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
                        document.getElementById('razorpay_signature').value = response.razorpay_signature;
                        document.getElementById('payment-form').submit();
                    },
                    "prefill": {
                        "name": "{{ request.session.customer_name }}",
                        "email": "{{ request.session.customer_email }}"
                    },
                    "theme": {
                        "color": "#2c4964"
                    }
                };

                var rzp1 = new Razorpay(options);

                document.getElementById('rzp-button1').onclick = function(e){
                    rzp1.open();
                    e.preventDefault();
                }
            </script>

            <div class="secure-badge">
                <i class="bi bi-patch-check-fill text-success"></i>
                Verified PCI-DSS Encryption
            </div>
        </div>

        <div class="bg-light p-3 text-center border-top">
            <img src="https://razorpay.com/assets/razorpay-glyph.svg" alt="Razorpay" width="80" style="filter: grayscale(1); opacity: 0.5;">
        </div>
    </div>
</div>

</body>
</html>
